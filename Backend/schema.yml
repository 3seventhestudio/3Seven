openapi: 3.0.3
info:
  title: 3Seven Studio API
  version: 1.0.0
  description: Premium Women's Fashion eCommerce REST API
paths:
  /api/accounts/addresses/:
    get:
      operationId: accounts_addresses_retrieve
      summary: List Addresses
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    post:
      operationId: accounts_addresses_create
      summary: List Addresses
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/addresses/{address_id}/:
    put:
      operationId: accounts_addresses_update
      summary: Update/Delete Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateUpdateAddressRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_addresses_partial_update
      summary: Update/Delete Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCreateUpdateAddressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCreateUpdateAddressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCreateUpdateAddressRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    delete:
      operationId: accounts_addresses_destroy
      summary: Update/Delete Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/accounts/addresses/{address_id}/default/:
    patch:
      operationId: accounts_addresses_default_partial_update
      summary: Set Default Address
      parameters:
      - in: path
        name: address_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Address
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      summary: Login User
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/logout/:
    post:
      operationId: accounts_logout_create
      summary: Logout User
      tags:
      - Authentication
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/profile/:
    get:
      operationId: accounts_profile_retrieve
      summary: Get Profile
      tags:
      - Profile
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    put:
      operationId: accounts_profile_update
      summary: Get Profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: accounts_profile_partial_update
      summary: Get Profile
      tags:
      - Profile
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/accounts/refresh/:
    post:
      operationId: accounts_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/accounts/register/:
    post:
      operationId: accounts_register_create
      summary: Register User
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/cart/:
    get:
      operationId: cart_retrieve
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/cart/add/:
    post:
      operationId: cart_add_create
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/cart/items/{cart_item_id}/:
    patch:
      operationId: cart_items_partial_update
      parameters:
      - in: path
        name: cart_item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/cart/items/{cart_item_id}/delete/:
    delete:
      operationId: cart_items_delete_destroy
      parameters:
      - in: path
        name: cart_item_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - cart
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/categories/:
    get:
      operationId: categories_retrieve
      tags:
      - categories
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/orders/:
    get:
      operationId: orders_list
      summary: List Orders
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/{order_number}/:
    get:
      operationId: orders_retrieve
      summary: Order Details
      parameters:
      - in: path
        name: order_number
        schema:
          type: string
        required: true
      tags:
      - Orders
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
          description: ''
  /api/orders/checkout/:
    post:
      operationId: orders_checkout_create
      tags:
      - orders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Checkout'
          description: ''
  /api/products/:
    get:
      operationId: products_retrieve
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/{slug}/:
    get:
      operationId: products_retrieve_2
      parameters:
      - in: path
        name: slug
        schema:
          type: string
        required: true
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/best-sellers/:
    get:
      operationId: products_best_sellers_retrieve
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/featured/:
    get:
      operationId: products_featured_retrieve
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/products/new-arrivals/:
    get:
      operationId: products_new_arrivals_retrieve
      tags:
      - products
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          description: No response body
components:
  schemas:
    AddressTypeEnum:
      enum:
      - HOME
      - WORK
      - OTHER
      type: string
      description: |-
        * `HOME` - Home
        * `WORK` - Work
        * `OTHER` - Other
    Checkout:
      type: object
      description: |-
        Checkout request serializer.

        The frontend only sends:
        - Shipping Address
        - Payment Method
        - Notes (optional)

        All pricing is calculated on the server.
      properties:
        address_id:
          type: string
          format: uuid
        payment_method:
          type: string
          maxLength: 30
        notes:
          type: string
          default: ''
      required:
      - address_id
      - payment_method
    CheckoutRequest:
      type: object
      description: |-
        Checkout request serializer.

        The frontend only sends:
        - Shipping Address
        - Payment Method
        - Notes (optional)

        All pricing is calculated on the server.
      properties:
        address_id:
          type: string
          format: uuid
        payment_method:
          type: string
          minLength: 1
          maxLength: 30
        notes:
          type: string
          default: ''
      required:
      - address_id
      - payment_method
    CreateUpdateAddressRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
        address_line_1:
          type: string
          minLength: 1
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 10
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        is_default:
          type: boolean
      required:
      - address_line_1
      - city
      - full_name
      - phone_number
      - postal_code
      - state
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Order:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_number:
          type: string
          maxLength: 30
        status:
          $ref: '#/components/schemas/StatusEnum'
        payment_method:
          $ref: '#/components/schemas/PaymentMethodEnum'
        payment_status:
          $ref: '#/components/schemas/PaymentStatusEnum'
        subtotal:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        shipping_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        grand_total:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        tracking_number:
          type: string
          maxLength: 100
        tracking_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
      required:
      - created_at
      - id
      - items
      - order_number
      - payment_method
    OrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product_name:
          type: string
          maxLength: 255
        sku:
          type: string
          maxLength: 100
        size:
          type: string
          maxLength: 50
        color:
          type: string
          maxLength: 100
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
      - id
      - product_name
      - quantity
      - sku
      - total_price
      - unit_price
    PatchedCreateUpdateAddressRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
        address_line_1:
          type: string
          minLength: 1
          maxLength: 255
        address_line_2:
          type: string
          maxLength: 255
        landmark:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 10
        address_type:
          $ref: '#/components/schemas/AddressTypeEnum'
        is_default:
          type: boolean
    PatchedUpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
    PaymentMethodEnum:
      enum:
      - cod
      - upi
      - card
      - netbanking
      type: string
      description: |-
        * `cod` - Cash On Delivery
        * `upi` - UPI
        * `card` - Card
        * `netbanking` - Net Banking
    PaymentStatusEnum:
      enum:
      - pending
      - paid
      - failed
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `paid` - Paid
        * `failed` - Failed
        * `refunded` - Refunded
    RegisterRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
        password:
          type: string
          writeOnly: true
          minLength: 8
        confirm_password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - confirm_password
      - email
      - first_name
      - last_name
      - password
      - phone_number
    StatusEnum:
      enum:
      - pending
      - confirmed
      - processing
      - shipped
      - delivered
      - cancelled
      - returned
      - refunded
      type: string
      description: |-
        * `pending` - Pending
        * `confirmed` - Confirmed
        * `processing` - Processing
        * `shipped` - Shipped
        * `delivered` - Delivered
        * `cancelled` - Cancelled
        * `returned` - Returned
        * `refunded` - Refunded
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
      required:
      - access
      - refresh
    TokenRefreshRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
      required:
      - refresh
    UpdateProfileRequest:
      type: object
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 100
        last_name:
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          minLength: 1
          maxLength: 15
      required:
      - first_name
      - last_name
      - phone_number
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
